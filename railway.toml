[build]
builder = "RAILPACK"

[deploy]
startCommand = "CONTEXTCORE_PREWARM_ON_STARTUP=0 CONTEXTCORE_ENABLE_WATCHER=0 CONTEXTCORE_STARTUP_SCAN=0 uvicorn unimain:app --host 0.0.0.0 --port ${PORT}"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
